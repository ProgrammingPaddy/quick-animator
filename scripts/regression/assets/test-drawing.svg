<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="grad"><stop offset="0" stop-color="#ff0000"/><stop offset="1" stop-color="#0000ff"/></linearGradient>
    <circle id="dot" r="10" fill="#00ff00"/>
  </defs>
  <rect id="plain" x="20" y="20" width="100" height="60" fill="#4f8cff"/>
  <rect id="rounded" x="140" y="20" width="100" height="60" rx="12" fill="#f59e0b"/>
  <circle id="ring" cx="300" cy="50" r="30" fill="none" stroke="#ffffff" stroke-width="4"/>
  <ellipse id="egg" cx="60" cy="150" rx="40" ry="25" fill="#22c55e" opacity="0.5"/>
  <g id="turned" transform="translate(200 150) rotate(30)">
    <rect x="-40" y="-20" width="80" height="40" fill="#a855f7"/>
    <text x="0" y="40" font-size="16" fill="#ffffff" text-anchor="middle" font-family="Arial">Hi</text>
  </g>
  <path id="donut" d="M 330 150 a 40 40 0 1 0 0.1 0 Z M 330 130 a 20 20 0 1 1 -0.1 0 Z" fill="#ef4444"/>
  <path id="wave" d="M 20 250 C 60 200 100 300 140 250 S 220 200 260 250" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <polygon id="tri" points="300,220 360,280 240,280" fill="url(#grad)"/>
  <polyline points="20,280 60,290 100,280" fill="none" stroke="#fbbf24" stroke-width="2" transform="skewX(10)"/>
  <use href="#dot" x="380" y="280"/>
  <image href="x.png" x="0" y="0" width="10" height="10"/>
</svg>
